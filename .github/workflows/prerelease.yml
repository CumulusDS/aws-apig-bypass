name: Prerelease
on:
  push:
    tags-ignore:
      - "**"
    branches-ignore:
      - "dependabot/**"
    paths:
      - .github/workflows/prerelease.yml
      - .yarn/versions/*
      - src/**/*
      - test/**/*
      - .eslintrc.js
      - .nvmrc
      - .yarnrc.yml
      - package.json
      - prettier.config.js
      - README.md
      - vitest.config.mts
      - tsconfig.esm.json
      - tsconfig.json
      - yarn.lock
jobs:
  prerelease:
    name: Publish Prerelease
    uses: CumulusDS/workflows-public/.github/workflows/package-prerelease.yml@master
    secrets: inherit
    with:
      npmjsPublishToken: ""
